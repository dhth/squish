[package]
name = "squish"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dhth/squish"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
image = "0.25.10"
infer = "0.22.0"
tempfile = "3.27.0"

[dev-dependencies]
insta = "1.49.0"
insta-cmd = "0.7.0"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
